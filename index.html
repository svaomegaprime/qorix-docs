<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./src/images/Qorix-fav-2.png" />
    <title>Qorix Docs</title>
    <script>
      // Fix for "Cannot set property fetch of #<Window> which has only a getter"
      // This happens when some libraries try to polyfill fetch in environments where it's read-only.
      (function () {
        const originalFetch = window.fetch;
        if (originalFetch) {
          try {
            Object.defineProperty(window, "fetch", {
              configurable: false,
              enumerable: true,
              get: function () {
                return originalFetch;
              },
              set: function () {
                /* Ignore attempts to overwrite */
              },
            });
          } catch (e) {
            // If we can't redefine it, it's likely already protected or we're in a strict environment.
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
